<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trash — Knowledge Workspace</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/documents.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div class="brand">
                <h2>Knowledge</h2>
                <span>Workspace</span>
            </div>

            <nav class="sidebar-nav">

                <button
                    class="nav-item"
                    type="button"
                    onclick="window.location.href='index.html'"
                >
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 10.5L12 3l9 7.5"></path>
                            <path d="M5.5 9.5V21h13V9.5"></path>
                            <path d="M9.5 21v-6h5v6"></path>
                        </svg>
                    </span>

                    Dashboard
                </button>

                <button
                    class="nav-item"
                    type="button"
                    onclick="window.location.href='documents.html'"
                >
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 3h9l4 4v14H6z"></path>
                            <path d="M14 3v5h5"></path>
                            <path d="M9 13h6"></path>
                            <path d="M9 17h6"></path>
                        </svg>
                    </span>

                    Documents
                </button>

                <button
                    class="nav-item"
                    type="button"
                >
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="5" r="2"></circle>
                            <circle cx="6" cy="17" r="2"></circle>
                            <circle cx="18" cy="17" r="2"></circle>
                            <path d="M12 7v5"></path>
                            <path d="M12 12L6 15"></path>
                            <path d="M12 12l6 3"></path>
                        </svg>
                    </span>

                    Mind Maps
                </button>

                <button
                    class="nav-item"
                    type="button"
                >
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.9z"></path>
                        </svg>
                    </span>

                    Favorites
                </button>

                <button
                    class="nav-item active"
                    type="button"
                >
                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 7h14"></path>
                            <path d="M9 7V4h6v3"></path>
                            <path d="M7 7l1 14h8l1-14"></path>
                            <path d="M10 11v6"></path>
                            <path d="M14 11v6"></path>
                        </svg>
                    </span>

                    Trash
                </button>

            </nav>

            

        </aside>

        <main class="main-content">

            <header class="topbar">

                <div class="search-container">
                    <input
                        type="text"
                        placeholder="Search your knowledge..."
                    >
                </div>

                <div class="topbar-actions">

                    <button
                        id="themeToggle"
                        title="Toggle theme"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5z"></path>
                        </svg>
                    </button>

                    <button
                        id="profileBtn"
                        title="Profile"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <circle
                                cx="12"
                                cy="8"
                                r="3.5"
                            ></circle>

                            <path d="M5 20a7 7 0 0 1 14 0"></path>
                        </svg>
                    </button>

                </div>

            </header>

            <section class="documents-page">

                <header class="documents-header">

                    <div>

                        <p class="documents-eyebrow">
                            DOCUMENT MANAGEMENT
                        </p>

                        <h1>
                            Trash
                        </h1>

                        <p>
                            Deleted documents are kept here before permanent removal.
                        </p>
                        <p class="trash-retention-note">
                            Items in Trash are automatically removed after 30 days.
                        </p>
                    </div>

                </header>

                <section>

                    <div
                        id="trashGrid"
                        class="document-grid"
                    ></div>

                </section>

            </section>

        </main>

    </div>
    <div
        id="modalBackdrop"
        class="modal-backdrop"
    >
        <div
            id="modal"
            class="modal"
            role="dialog"
            aria-modal="true"
        >
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button
                    id="modalClose"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>
            </div>

            <p id="modalDescription"></p>

            <input
                id="modalInput"
                type="text"
                autocomplete="off"
            >

            <div class="modal-actions">
                <button
                    id="modalCancel"
                    class="secondary-btn"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="modalConfirm"
                    class="primary-btn"
                    type="button"
                >
                    Confirm
                </button>
            </div>
        </div>
    </div>
    <div
        id="toastContainer"
        class="toast-container"
    ></div>
    <script type="module" src="js/app.js"></script>

</body>

</html>
