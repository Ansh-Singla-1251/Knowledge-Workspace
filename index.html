<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Knowledge Workspace</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div class="brand">
                <h2>Knowledge</h2>
                <span>Workspace</span>
            </div>


            <nav class="sidebar-nav">

                <button class="nav-item active">

                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 10.5L12 3l9 7.5"></path>
                            <path d="M5.5 9.5V21h13V9.5"></path>
                            <path d="M9.5 21v-6h5v6"></path>
                        </svg>
                    </span>

                    Dashboard

                </button>


                <button class="nav-item">

                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 3h9l4 4v14H6z"></path>
                            <path d="M14 3v5h5"></path>
                            <path d="M9 13h6"></path>
                            <path d="M9 17h6"></path>
                        </svg>
                    </span>

                    Documents

                </button>


                <button class="nav-item">

                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="5" r="2"></circle>
                            <circle cx="6" cy="17" r="2"></circle>
                            <circle cx="18" cy="17" r="2"></circle>
                            <path d="M12 7v5"></path>
                            <path d="M12 12L6 15"></path>
                            <path d="M12 12l6 3"></path>
                        </svg>
                    </span>

                    Mind Maps

                </button>


                <button class="nav-item">

                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.9z"></path>
                        </svg>
                    </span>

                    Favorites

                </button>


                <button class="nav-item">

                    <span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 7h14"></path>
                            <path d="M9 7V4h6v3"></path>
                            <path d="M7 7l1 14h8l1-14"></path>
                            <path d="M10 11v6"></path>
                            <path d="M14 11v6"></path>
                        </svg>
                    </span>

                    Trash

                </button>

            </nav>


            <div class="sidebar-section">

                <div class="section-header">

                    <span>WORKSPACES</span>

                    <button
                        id="addWorkspaceBtn"
                        title="Add workspace"
                    >
                        +
                    </button>

                </div>

                <div id="workspaceList"></div>

            </div>


            <div class="sidebar-section">

                <div class="section-header">

                    <span>FOLDERS</span>

                    <button
                        id="addFolderBtn"
                        title="Add folder"
                    >
                        +
                    </button>

                </div>

                <div id="folderList"></div>

            </div>

        </aside>


        <main class="main-content">


            <header class="topbar">

                <div class="search-container">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search your knowledge..."
                    >

                </div>


                <div class="topbar-actions">

                    <button
                        id="themeToggle"
                        title="Toggle theme"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5z"></path>
                        </svg>

                    </button>


                    <button
                        id="profileBtn"
                        title="Profile"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <circle
                                cx="12"
                                cy="8"
                                r="3.5"
                            ></circle>

                            <path d="M5 20a7 7 0 0 1 14 0"></path>
                        </svg>

                    </button>

                </div>

            </header>


            <section class="dashboard">


                <div class="dashboard-header">


                    <div class="hero-copy">

                        <div class="hero-label">

                            <span class="hero-dot"></span>

                            YOUR KNOWLEDGE SPACE

                        </div>


                        <h1>
                            Think.
                            <span>Connect.</span>
                            Create.
                        </h1>


                        <p class="subtitle">
                            A visual space for the ideas you don't want to lose.
                        </p>

                    </div>


                    <div class="hero-side">

                        <div class="hero-shape hero-shape-yellow"></div>

                        <div class="hero-shape hero-shape-purple"></div>

                        <div class="hero-shape hero-shape-teal"></div>


                        <button
                            id="createDocumentBtn"
                            class="primary-btn"
                        >

                            <span>+</span>

                            New Document

                        </button>

                    </div>

                </div>


                <div class="quick-actions">


                    <button class="quick-card">

                        <span>
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M6 3h9l4 4v14H6z"></path>
                                <path d="M14 3v5h5"></path>
                                <path d="M9 13h6"></path>
                                <path d="M9 17h4"></path>
                            </svg>
                        </span>

                        <strong>New Document</strong>

                        <small>Start writing</small>

                    </button>


                    <button class="quick-card">

                        <span>
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="5" r="2"></circle>
                                <circle cx="6" cy="17" r="2"></circle>
                                <circle cx="18" cy="17" r="2"></circle>
                                <path d="M12 7v5"></path>
                                <path d="M12 12L6 15"></path>
                                <path d="M12 12l6 3"></path>
                            </svg>
                        </span>

                        <strong>New Mind Map</strong>

                        <small>Connect ideas</small>

                    </button>


                    <button class="quick-card">

                        <span>
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H10l2 2h5.5A2.5 2.5 0 0 1 20 8.5v9A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5z"></path>
                            </svg>
                        </span>

                        <strong>New Folder</strong>

                        <small>Organize knowledge</small>

                    </button>

                </div>


                <section class="content-section">


                    <div class="section-title">

                        <div>

                            <h2>Recent Documents</h2>

                            <p>
                                Your recently updated knowledge
                            </p>

                        </div>


                        <button class="text-btn">
                            View all →
                        </button>

                    </div>


                    <div
                        id="documentGrid"
                        class="document-grid"
                    >

                        <div class="empty-state">

                            <div class="empty-icon">

                                <svg
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >
                                    <path d="M6 3h9l4 4v14H6z"></path>
                                    <path d="M14 3v5h5"></path>
                                    <path d="M9 13h6"></path>
                                    <path d="M9 17h4"></path>
                                </svg>

                            </div>


                            <h3>
                                No documents yet
                            </h3>


                            <p>
                                Create your first document and start building
                                your knowledge workspace.
                            </p>


                            <button
                                id="emptyCreateDocumentBtn"
                                class="primary-btn"
                            >
                                Create your first document
                            </button>

                        </div>

                    </div>

                </section>

            </section>

        </main>

    </div>


    <div
        id="modalBackdrop"
        class="modal-backdrop"
    >

        <div
            id="modal"
            class="modal"
        >

            <div class="modal-header">

                <div>

                    <h3 id="modalTitle">
                        Rename
                    </h3>

                    <p
                        id="modalDescription"
                        class="modal-description"
                    ></p>

                </div>


                <button
                    id="modalClose"
                    class="modal-close"
                    type="button"
                >
                    ×
                </button>

            </div>


            <input
                id="modalInput"
                class="modal-input"
                type="text"
                autocomplete="off"
            >


            <div class="modal-actions">

                <button
                    id="modalCancel"
                    class="modal-btn modal-btn-secondary"
                    type="button"
                >
                    Cancel
                </button>


                <button
                    id="modalConfirm"
                    class="modal-btn modal-btn-primary"
                    type="button"
                >
                    Confirm
                </button>

            </div>

        </div>

    </div>


    <div
        id="toastContainer"
        class="toast-container"
    ></div>


    <script
        type="module"
        src="js/app.js"
    ></script>

</body>

</html>
