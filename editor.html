<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Knowledge Workspace — Editor</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/components.css">
    
</head>

<body class="editor-page">

    <header class="editor-topbar">

        <a
            href="index.html"
            class="editor-back"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M19 12H5"></path>
                <path d="M12 19l-7-7 7-7"></path>
            </svg>

            <span>Workspace</span>
        </a>

        

        <div class="editor-status">

            <span
                class="save-indicator"
                id="saveIndicator"
            >
                Saved
            </span>

        </div>

    </header>


    <main class="editor-main">

        <div class="editor-container">

            <input
                type="text"
                id="documentTitle"
                class="document-title"
                placeholder="Untitled document"
                autocomplete="off"
            >


            <div
                id="editorBlocks"
                class="editor-blocks"
            >

                <!-- Blocks will be inserted here -->

            </div>

            <div class="add-block-wrapper">

                <button
                    id="addBlockBtn"
                    class="add-block-btn"
                    type="button"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M12 5v14"></path>
                        <path d="M5 12h14"></path>
                    </svg>

                    <span>Add block</span>

                </button>
            </div>
            <div id="blockMenu" class="block-menu">

    <button
        type="button"
        data-block-type="paragraph"
    >
        <strong>¶</strong>
        <span>
            <b>Paragraph</b>
            <small>Normal text</small>
        </span>
    </button>

    <button
        type="button"
        data-block-type="heading"
    >
        <strong>H</strong>
        <span>
            <b>Heading</b>
            <small>Section title</small>
        </span>
    </button>

    <button
        type="button"
        data-block-type="bullet"
    >
        <strong>•</strong>
        <span>
            <b>Bullet</b>
            <small>List item</small>
        </span>
    </button>

    <button
        type="button"
        data-block-type="mindmap"
    >
        <strong>◇</strong>
        <span>
            <b>Mind Map</b>
            <small>Visual connections</small>
        </span>
    </button>

    <button
        type="button"
        data-block-type="code"
    >
        <strong>&lt;/&gt;</strong>
        <span>
            <b>Code</b>
            <small>Code block</small>
        </span>
    </button>

</div>
            <section class="document-attachments">

                <div class="attachment-header">
                    <h3>Attachments</h3>

                    <span>
                        Files attached to this document
                    </span>
                </div>

                <div id="attachmentList"></div>

            </section>

           
            <section class="document-connections">

                <div class="connection-section">
                    <h3>Linked documents</h3>
                    <div id="linkedDocuments"></div>
                </div>

                <div class="connection-section">
                    <h3>Backlinks</h3>
                    <div id="backlinkDocuments"></div>
                </div>

            </section>

        </div>

    </main>

<div class="editor-floating-actions">

    <span class="editor-floating-label">
        TOOLS
    </span>

    <button
        id="wikipediaToggle"
        class="editor-research-btn"
        type="button"
    >
        <span>⌕</span>
        Research
    </button>

    <button
        id="linkDocumentBtn"
        class="editor-link-btn"
        type="button"
    >
        <span>↗</span>
        Link document
    </button>

    <button
        id="attachFileBtn"
        class="editor-link-btn"
        type="button"
    >
        <span>□</span>
        Attach file
    </button>

    <input
        id="attachmentInput"
        type="file"
        multiple
        hidden
    >

</div>
    <aside
        id="wikipediaPanel"
        class="wikipedia-panel"
    >

        <div class="wikipedia-panel-header">

            <div>
                <span class="wikipedia-panel-eyebrow">
                    RESEARCH
                </span>

                <h2>Wikipedia</h2>

                <p>
                    Find information without leaving your notes.
                </p>
            </div>

            <button
                id="wikipediaClose"
                class="wikipedia-close"
                type="button"
                aria-label="Close research panel"
            >
                ×
            </button>

        </div>


        <div class="wikipedia-search">

            <input
                id="wikipediaSearch"
                type="text"
                placeholder="Search Wikipedia..."
                autocomplete="off"
            >

            <button
                id="wikipediaSearchBtn"
                type="button"
            >
                Search
            </button>

        </div>


        <div
            id="wikipediaResults"
            class="wikipedia-results"
        >

            <div class="wikipedia-empty">
                Search Wikipedia to start researching.
            </div>

        </div>

    </aside>


    <div id="modalBackdrop" class="modal-backdrop">

        <div id="modal" class="modal">

            <button
                id="modalClose"
                class="modal-close"
                type="button"
            >
                ×
            </button>

            <h2 id="modalTitle"></h2>

            <p id="modalDescription"></p>

            <input
                id="modalInput"
                name="modalInput"
                type="text"
                autocomplete="off"
            >

            <div class="modal-actions">

                <button
                    id="modalCancel"
                    class="secondary-btn"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="modalConfirm"
                    class="primary-btn"
                    type="button"
                >
                    Confirm
                </button>

            </div>

        </div>

    </div>
    <script type="module">
        import {requireLogin} from "./js/auth/auth.js";

        requireLogin();
    </script>

    <script
        type="module"
        src="js/editor/editor.js"
    ></script>

</body>

</html>
